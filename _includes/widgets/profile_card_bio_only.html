<div class="row newspaper-bio">
    <div class="col">
        <section class="newspaper-lead">
            <h2 class="newspaper-section-heading">About Me</h2>
            <div class="text-profile-bio" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                {{ site.data.profile.short_bio }}
            </div>
            {% if site.data.profile.cv_link %}
            <a class="newspaper-cv-link" target="_blank" rel="noopener noreferrer" href="{{ site.data.profile.cv_link | relative_url }}">Curriculum Vitae <span aria-hidden="true">&rarr;</span></a>
            {% endif %}
        </section>
    </div>
</div>
